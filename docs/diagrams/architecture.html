<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tranche architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f4f2ec;
      --paper-2: #ececec;
      --ink: #14161c;
      --muted: #4a4f5c;
      --soft: #8b909c;
      --rule: #d5d1c4;
      --rule-solid: #b9b4a5;
      --accent: #0d6e6e;
      --accent-tint: rgba(13, 110, 110, 0.08);
      --link: #a8253c;
      --sans: "Inter", system-ui, sans-serif;
      --serif: "Instrument Serif", Georgia, serif;
      --mono: "JetBrains Mono", ui-monospace, monospace;
    }
    body {
      font-family: var(--sans);
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1080px; width: 100%; }
    .eyebrow {
      font-family: var(--mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · SERV Hackathon 02 · Kite track</p>
    <h1>Tranche architecture</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch-title arch-desc">
        <title id="arch-title">Tranche architecture</title>
        <desc id="arch-desc">The release room calls a Rust policy core, which checks public evidence, asks SERV for judgment, asks Reppo for an independent verdict, and instructs Kite Passport to settle.</desc>

        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4a4f5c" /></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0d6e6e" /></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a8253c" /></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f4f2ec" />

        <!-- zones -->
        <rect x="310" y="96" width="330" height="450" rx="8" fill="rgba(20,22,28,0.02)" stroke="rgba(20,22,28,0.10)" stroke-width="0.8" />
        <rect x="322" y="100" width="112" height="14" rx="2" fill="#f4f2ec" />
        <text x="378" y="110" fill="#4a4f5c" font-size="7" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.14em">TRANCHE CORE / RUST</text>

        <rect x="660" y="76" width="270" height="476" rx="8" fill="rgba(20,22,28,0.02)" stroke="rgba(20,22,28,0.10)" stroke-width="0.8" />
        <rect x="672" y="80" width="118" height="14" rx="2" fill="#f4f2ec" />
        <text x="731" y="90" fill="#4a4f5c" font-size="7" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.14em">EXTERNAL SERVICES</text>

        <!-- arrows first -->
        <path d="M 220,310 H 340" fill="none" stroke="#4a4f5c" stroke-width="1.2" marker-end="url(#arrow)" />
        <path d="M 450,370 V 430" fill="none" stroke="#4a4f5c" stroke-width="1.2" marker-end="url(#arrow)" />

        <path d="M 560,274 H 592 Q 600,274 600,266 V 160 Q 600,152 608,152 H 690" fill="none" stroke="#4a4f5c" stroke-width="1.2" marker-end="url(#arrow)" />
        <path d="M 560,294 H 690" fill="none" stroke="#4a4f5c" stroke-width="1.2" marker-end="url(#arrow)" />
        <path d="M 560,314 H 612 Q 620,314 620,322 V 376 Q 620,384 628,384 H 690" fill="none" stroke="#0d6e6e" stroke-width="1.4" marker-end="url(#arrow-accent)" />
        <path d="M 560,334 H 632 Q 640,334 640,342 V 492 Q 640,500 648,500 H 690" fill="none" stroke="#a8253c" stroke-width="1.2" marker-end="url(#arrow-link)" />

        <!-- arrow labels -->
        <rect x="250" y="286" width="64" height="12" rx="2" fill="#f4f2ec" />
        <text x="282" y="295" fill="#4a4f5c" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EVIDENCE</text>

        <rect x="458" y="390" width="44" height="12" rx="2" fill="#f4f2ec" />
        <text x="480" y="399" fill="#4a4f5c" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AUDIT</text>

        <rect x="608" y="201" width="72" height="12" rx="2" fill="#f4f2ec" />
        <text x="644" y="210" fill="#4a4f5c" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">JUDGMENT</text>

        <rect x="595" y="270" width="60" height="12" rx="2" fill="#f4f2ec" />
        <text x="625" y="279" fill="#4a4f5c" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VERDICT</text>

        <rect x="626" y="337" width="56" height="12" rx="2" fill="#f4f2ec" />
        <text x="654" y="346" fill="#0d6e6e" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RELEASE</text>

        <rect x="646" y="407" width="48" height="12" rx="2" fill="#f4f2ec" />
        <text x="670" y="416" fill="#a8253c" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CHECKS</text>

        <!-- callout -->
        <text x="40" y="430" fill="#8b909c" font-size="14" font-family="'Instrument Serif', serif" font-style="italic">The graph is compiled before work starts.</text>
        <text x="40" y="450" fill="#8b909c" font-size="14" font-family="'Instrument Serif', serif" font-style="italic">Every node writes an audit record.</text>

        <!-- browser -->
        <g>
          <rect x="40" y="266" width="180" height="88" rx="6" fill="#f4f2ec" />
          <rect x="40" y="266" width="180" height="88" rx="6" fill="#f4f2ec" stroke="#14161c" stroke-width="1" />
          <rect x="48" y="272" width="38" height="12" rx="2" fill="transparent" stroke="rgba(20,22,28,0.40)" stroke-width="0.8" />
          <text x="67" y="281" fill="rgba(20,22,28,0.80)" font-size="7" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLIENT</text>
          <text x="130" y="312" fill="#14161c" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Release room</text>
          <text x="130" y="328" fill="#4a4f5c" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">Next.js · TypeScript</text>
        </g>

        <!-- api -->
        <g>
          <rect x="340" y="250" width="220" height="120" rx="6" fill="#f4f2ec" />
          <rect x="340" y="250" width="220" height="120" rx="6" fill="rgba(13,110,110,0.08)" stroke="#0d6e6e" stroke-width="1.4" />
          <rect x="348" y="256" width="34" height="12" rx="2" fill="transparent" stroke="rgba(13,110,110,0.55)" stroke-width="0.8" />
          <text x="365" y="265" fill="#0d6e6e" font-size="7" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
          <text x="450" y="300" fill="#14161c" font-size="13" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Tranche API</text>
          <text x="450" y="316" fill="#0d6e6e" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">Axum · policy gate</text>
          <text x="450" y="336" fill="#4a4f5c" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">compile · verify · settle</text>
        </g>

        <!-- sqlite -->
        <g>
          <rect x="372" y="430" width="156" height="72" rx="6" fill="#f4f2ec" />
          <rect x="372" y="430" width="156" height="72" rx="6" fill="#ececec" stroke="#b9b4a5" stroke-width="1" />
          <rect x="380" y="436" width="34" height="12" rx="2" fill="transparent" stroke="rgba(20,22,28,0.40)" stroke-width="0.8" />
          <text x="397" y="445" fill="rgba(20,22,28,0.80)" font-size="7" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
          <text x="450" y="474" fill="#14161c" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Audit ledger</text>
          <text x="450" y="490" fill="#4a4f5c" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">SQLite · SQLx</text>
        </g>

        <!-- serv -->
        <g>
          <rect x="690" y="116" width="210" height="72" rx="6" fill="#f4f2ec" />
          <rect x="690" y="116" width="210" height="72" rx="6" fill="#f4f2ec" stroke="#4a4f5c" stroke-width="1" />
          <rect x="698" y="122" width="36" height="12" rx="2" fill="transparent" stroke="rgba(74,79,92,0.45)" stroke-width="0.8" />
          <text x="716" y="131" fill="#4a4f5c" font-size="7" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
          <text x="795" y="160" fill="#14161c" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">SERV Reasoning</text>
          <text x="795" y="176" fill="#4a4f5c" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">bounded claim review</text>
        </g>

        <!-- reppo -->
        <g>
          <rect x="690" y="258" width="210" height="72" rx="6" fill="#f4f2ec" />
          <rect x="690" y="258" width="210" height="72" rx="6" fill="#f4f2ec" stroke="#4a4f5c" stroke-width="1" />
          <rect x="698" y="264" width="36" height="12" rx="2" fill="transparent" stroke="rgba(74,79,92,0.45)" stroke-width="0.8" />
          <text x="716" y="273" fill="#4a4f5c" font-size="7" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JUDGE</text>
          <text x="795" y="302" fill="#14161c" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Reppo Eval</text>
          <text x="795" y="318" fill="#4a4f5c" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">independent verdict</text>
        </g>

        <!-- kite -->
        <g>
          <rect x="690" y="348" width="210" height="72" rx="6" fill="#f4f2ec" />
          <rect x="690" y="348" width="210" height="72" rx="6" fill="#f4f2ec" stroke="#0d6e6e" stroke-width="1.2" />
          <rect x="698" y="354" width="32" height="12" rx="2" fill="transparent" stroke="rgba(13,110,110,0.55)" stroke-width="0.8" />
          <text x="714" y="363" fill="#0d6e6e" font-size="7" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RAIL</text>
          <text x="795" y="392" fill="#14161c" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Kite Passport</text>
          <text x="795" y="408" fill="#4a4f5c" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">caps · settlement · receipt</text>
        </g>

        <!-- github -->
        <g>
          <rect x="690" y="464" width="210" height="72" rx="6" fill="#f4f2ec" />
          <rect x="690" y="464" width="210" height="72" rx="6" fill="#f4f2ec" stroke="#a8253c" stroke-width="1" />
          <rect x="698" y="470" width="42" height="12" rx="2" fill="transparent" stroke="rgba(168,37,60,0.45)" stroke-width="0.8" />
          <text x="719" y="479" fill="#a8253c" font-size="7" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SOURCE</text>
          <text x="795" y="508" fill="#14161c" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">GitHub</text>
          <text x="795" y="524" fill="#4a4f5c" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">public evidence</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
